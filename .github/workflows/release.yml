# Manual tag-driven fpk release.
#
# The git tag is the single version source:
#   git tag v1.273.0 && git push --tags
#     -> builds the fpk on an overseas runner
#     -> creates a GitHub Release with the fpk attached
#
# Tag format: v<fpk-version>. Usually fpk version == upstream metacubexd
# version, BUT local packaging releases (fnOS-gateway compat etc.) bump a
# local patch version (e.g. v1.273.1 built from upstream v1.273.0 source):
# the upstream SOURCE version always resolves to the repo manifest `version=`
# (kept in lockstep with upstream by auto-follow), or the explicit `upstream`
# dispatch input. Never assume appver == upstream source tag.
# The mihomo kernel version is resolved from the LATEST upstream release at
# build time (kernel tracking is independent of the panel version).
#
# Pushes to main do NOT build. Scheduled upstream follows live in
# auto-follow.yml; the heavy lifting lives in the reusable build-fpk.yml.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      appver:
        description: 'fpk version (no v, e.g. 1.273.1)'
        required: true
      upstream:
        description: 'upstream metacubexd source version (no v). Empty = manifest version'
        required: false
        default: ''
      mihomo:
        description: 'mihomo kernel version (no v, e.g. 1.19.30). Empty = latest'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  resolve:
    name: resolve versions
    runs-on: ubuntu-latest
    outputs:
      appver: ${{ steps.ver.outputs.appver }}
      upstream: ${{ steps.ver.outputs.upstream }}
      mihomo: ${{ steps.ver.outputs.mihomo }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions from tag / inputs
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            appver='${{ github.event.inputs.appver }}'
            upstream='${{ github.event.inputs.upstream }}'
            mihomo='${{ github.event.inputs.mihomo }}'
          else
            appver="${GITHUB_REF_NAME#v}"
            upstream=''
            mihomo=''
          fi
          # Upstream source version: explicit input wins, else the repo
          # manifest (auto-follow keeps it equal to the followed upstream,
          # so a local packaging version like 1.273.1 still builds from
          # upstream 1.273.0 source).
          if [ -z "$upstream" ]; then
            upstream="$(sed -n 's/^version=//p' src/manifest | head -1 | tr -d '[:space:]')"
          fi
          if [ -z "$mihomo" ]; then
            mihomo="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
              | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)"
          fi
          echo "appver=$appver" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "mihomo=$mihomo" >> "$GITHUB_OUTPUT"
          echo "resolved: appver=$appver upstream=$upstream mihomo=$mihomo"

  build:
    name: build
    needs: resolve
    uses: ./.github/workflows/build-fpk.yml
    with:
      appver: ${{ needs.resolve.outputs.appver }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      mihomo: ${{ needs.resolve.outputs.mihomo }}

  release:
    name: release
    needs: [resolve, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download fpk artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          pattern: metacubexd-fpk-*
          merge-multiple: true

      - name: Create release with fpks (x86 + arm)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve.outputs.appver }}
          files: dist-all/*.fpk
          generate_release_notes: true
          # make_latest: keep default; overwrite_files drops same-name assets

      # Remove legacy fixed-name assets from earlier releases of this tag
      # (pre-dual-platform era), so the Release only carries versioned fpks.
      - name: Prune legacy unversioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.resolve.outputs.appver }}
        run: |
          release_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          for name in metacubexd.fpk metacubexd.fpk.info.txt; do
            asset_id="$(echo "$release_json" | python3 -c \
              "import json,sys; print(next((a['id'] for a in json.load(sys.stdin).get('assets',[]) if a['name']=='$name'), ''))" 2>/dev/null || true)"
            if [ -n "$asset_id" ]; then
              curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                && echo "pruned legacy asset: $name"
            fi
          done
